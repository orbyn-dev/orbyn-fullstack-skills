name: Validate skills
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-retirement:
    name: Windows retirement contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Native lock, usage, path and disposable recycling contracts
        env:
          ORBYN_TEST_RECYCLE: '1'
        run: python -m unittest discover -s tests -p test_worktree_retire_windows.py -v
  validate:
    name: Validate (Python ${{ matrix.python }})
    # Self-hosted only when the repository variable CI_RUNNER is 'local'. Keep CI_RUNNER
    # unset while this repository is public. The boundary is the orbyn-local runner group,
    # which serves private repositories only; the fork check below is a convenience, not a
    # security boundary, because a fork's pull_request runs its own copy of this file. Once
    # the repository is private, keep "Run workflows from fork pull requests" off.
    # With CI_RUNNER set and no runner up, jobs wait in the queue; unset it to recover.
    # Runner image: Ubuntu 22.04 or 24.04 based, non-root, git 2.18+, a C++ compiler, lsof,
    # ffmpeg and a writable tool cache, so no test that runs on hosted runners skips locally.
    runs-on: ${{ vars.CI_RUNNER == 'local' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","orbyn-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PRs run 3.11 only, the required check; main, nightly and manual runs add 3.13.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11"]' || '["3.11", "3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate library, presets and evaluation cases
        run: python3 scripts/check-library.py
      - name: Install numpy for generated-audio contract tests
        run: python3 -m pip install numpy==2.3.5
      - name: Require an authoring record for every changed skill
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-authoring.py --base "$BASE_SHA"
      - name: Warn when a PR changes existing lint, format, type or test configuration (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/pr_gate.py config-check --base "$BASE_SHA"
      - name: Verify helpers affected by this change, plus the protected set (no model calls)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/run_tests.py --changed-from "$BASE_SHA" --jobs 8  # tests wait on git and subprocesses
      - name: Verify every helper with synthetic fixtures (no model calls)
        if: github.event_name != 'pull_request'
        run: python3 scripts/run_tests.py --jobs 8
      - name: Verify bundled audit record validators (synthetic data, no target audit)
        run: |
          node --version
          node --test skills/orbyn-security-audit/references/upstream/audit-records/validate-findings.test.cjs skills/orbyn-security-audit/references/upstream/audit-records/validate-coverage-ledger.test.cjs
      - run: git diff --check
