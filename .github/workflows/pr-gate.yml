name: PR gate
# Runs from main, so a PR cannot change its own gate. It reads the PR through the API
# and never checks out or runs PR code, which is what makes pull_request_target safe.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [Validate skills]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true
jobs:
  gate:
    name: PR gate
    # Self-hosted only when CI_RUNNER is 'local' and the PR or triggering run is not from a
    # fork; keep CI_RUNNER unset while this repository is public.
    runs-on: ${{ vars.CI_RUNNER == 'local' && ((github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository)) && fromJSON('["self-hosted","orbyn-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Label the PR and request review when it is ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MAINTAINER: ${{ vars.PR_REVIEWER || 'kinqsradio' }}
          EVENT_ACTION: ${{ github.event.action }}
        run: python3 scripts/pr_gate.py apply --pr "$PR_NUMBER" --sha "$HEAD_SHA" --maintainer "$MAINTAINER" --action "$EVENT_ACTION"
      - name: Label the PR by area, contributor, tooling and size
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/pr_labels.py apply --pr "$PR_NUMBER"
